[popups]
# Bar flyouts (clock, audio, network, bluetooth... panels, dropdowns, OSD).
# See-through like the menu, so the blur in hyprland.lua shows (it needs alpha > 0.3).
background       = "#1a1d22"
background-alpha = 0.75
text             = "#ddd4c3"
border           = "rgba(e6e5e6cc) rgba(c1bec1cc) 45deg"  # Silver, matching the window borders in hyprland.lua.
border-alpha     = 1.0
